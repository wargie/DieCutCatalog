services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diecut_catalog
      POSTGRES_USER: diecut_catalog
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diecut_catalog -d diecut_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
